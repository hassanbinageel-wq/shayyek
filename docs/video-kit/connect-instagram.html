const STEPS = [

  { n: 4, t: "سجّل دخولك عند Meta ووافق", s: "كلمة المرور تنكتب عند Meta فقط — شيّك ما يطلبها أبدًا", mock: true, a: 26.8, b: 35.9 },

];
STEPS.forEach((s) => (s.dur = s.b - s.a));
if (DESK) {

  if (DESK && !st.ig) {

const typeText = (s, lt, a, b) => s.slice(0, Math.round(s.length * clamp((lt - a) / (b - a))));

  const show = (el, o) => (el.style.opacity = o);

    { const dev = el.querySelector(".phone, .laptop"); dev.style.transform = `${dev.classList.contains("phone") ? `scale(${S}) ` : ""}translateY(${120 * (1 - ease((lt - 0.1) / 0.7))}px)`; }
